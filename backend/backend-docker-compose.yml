version: '3.8'

# AVISO: arquivo legado usado apenas em testes antigos do backend.
# Para desenvolvimento ou produção, use SEMPRE o docker-compose.yml na raiz do projeto:
#   cd .. && docker compose up -d --build
# Este arquivo é mantido apenas como referência e não deve ser usado em produção.

services:
  backend-legacy:
    restart: "no"
    build: .
    container_name: padaria-backend-legacy
    ports:
      - "9000:8000"
    volumes:
      - .:/app
      - ./data.db:/app/data.db
    environment:
      - PYTHONUNBUFFERED=1