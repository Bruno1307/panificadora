services:
  frontend-prod:
    build: .
    image: padaria-frontend:prod
    container_name: padaria-frontend-prod
    ports:
      - "4173:80"
    restart: always
    volumes:
      - ./dist:/usr/share/nginx/html
    networks:
      - padaria_net

networks:
  padaria_net:
    external: true
    name: panificadora_padaria_net
