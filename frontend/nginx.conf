server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Desabilita cache para arquivos de configuração
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }
    location = /config-domain.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Serve static files and enable SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API with /api prefix and WebSocket support
    location /api/ {
        # Strip /api prefix
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://padaria-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: increase default body size if needed
    client_max_body_size 10M;
}
