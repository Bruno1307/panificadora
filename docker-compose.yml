services:
  backend:
    build: ./backend
    container_name: padaria-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data.db:/app/data.db
      - /run/cups/cups.sock:/run/cups/cups.sock
    environment:
      - PYTHONUNBUFFERED=1
      - LOCAL_TIME_OFFSET_HOURS=-3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - padaria-net

  frontend:
    build: ./frontend
    container_name: padaria-frontend
    ports:
      - "80:80"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000/
    depends_on:
      - backend
    volumes:
      - ./frontend/public/config.json:/usr/share/nginx/html/config.json
    networks:
      - padaria-net

networks:
  padaria-net:
    driver: bridge
