server {
    listen 80;
    # Responde ao domínio local desejado e a qualquer outro host
    server_name panificadora.jardim _;

    root /usr/share/nginx/html;
    index index.html;

    # Desabilita cache para arquivos de configuração
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }
    location = /config-domain.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    # Proxy para API do backend sob /api
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve arquivos estáticos e roteamento client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: aumentar body size se necessário
    client_max_body_size 10M;
}
